name: Deploy Environment
description: Builds, pushes lambda images and applies Terraform for a given environment
inputs:
    environment:
        description: Target environment (dev or prod)
        required: true
    aws-access-key-id:
        required: true
    aws-secret-access-key:
        required: true
    aws-region:
        required: false
        default: eu-west-2
    auto-approve:
        description: auto-yes or auto-no
        required: false
        default: auto-yes
    python-version:
        required: false
        default: "3.12"
runs:
    using: composite
    steps:
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
              aws-access-key-id: ${{ inputs.aws-access-key-id }}
              aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
              aws-region: ${{ inputs.aws-region }}

        - name: Set up Python ${{ inputs.python-version }}
          uses: actions/setup-python@v5
          with:
              python-version: ${{ inputs.python-version }}

        - name: Install dependencies
          shell: bash
          run: |
              python -m pip install --upgrade pip
              pip install -r lambda_src/dev_env_requirements.txt

        - name: Run unit tests
          shell: bash
          run: pytest --ignore=lambda_src/integration_test/

        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Deploy ${{ inputs.environment }} environment
          shell: bash
          run: source deploy.sh ${{ inputs.environment }} ${{ inputs.auto-approve }}
